# Prod overrides: helm install podinfo . -f values-prod.yaml
replicaCount: 3

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 128Mi

hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 6
  cpuUtilization: 70
  memoryUtilization: 80

pdb:
  enabled: true
  minAvailable: 2

redis:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

ingress:
  enabled: true
  className: nginx
  host: podinfo.prod.local
