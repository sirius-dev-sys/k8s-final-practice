{{- if and .Values.tests.enabled .Values.service.enabled .Values.tests.timeout.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "podinfo.fullname" . }}-test-timeout
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "podinfo.auxLabels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  containers:
    - name: hang
      image: "{{ .Values.tests.image.repository }}:{{ .Values.tests.image.tag }}"
      command: ["sh", "-c", "echo hanging; sleep 3600"]
{{- end }}
