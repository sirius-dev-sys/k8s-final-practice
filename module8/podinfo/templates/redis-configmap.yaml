{{- if .Values.redis.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "podinfo.redis.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "podinfo.redis.labels" . | nindent 4 }}
data:
  redis.conf: |
    port {{ .Values.redis.port }}
    {{- .Values.redis.config | nindent 4 }}
{{- end }}
